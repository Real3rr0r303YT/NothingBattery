name: Release

on:
  push:
    tags: ["v*"]
  # Manual start (Actions tab → Release → Run workflow): creates tag v<versionName> itself.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, sign & publish release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NB_KEYSTORE_BASE64: ${{ secrets.NB_KEYSTORE_BASE64 }}
      NB_KEYSTORE_PASSWORD: ${{ secrets.NB_KEYSTORE_PASSWORD }}
      NB_KEY_ALIAS: ${{ secrets.NB_KEY_ALIAS }}
      NB_KEY_PASSWORD: ${{ secrets.NB_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches versionName
        run: |
          version="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Decode signing keystore
        run: |
          for v in NB_KEYSTORE_BASE64 NB_KEYSTORE_PASSWORD NB_KEY_ALIAS NB_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v (see README → Signing)"; exit 1; fi
          done
          echo "$NB_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "NB_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Assemble signed release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signature & permissions
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          ./scripts/check-permissions.sh "$apk"
          mkdir -p dist
          cp "$apk" "dist/NothingBattery-v$VERSION.apk"
          (cd dist && sha256sum "NothingBattery-v$VERSION.apk" > "NothingBattery-v$VERSION.apk.sha256")

      - name: Extract changelog section
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          printf '\n---\nMade by Real3rr0r303YT · 100 %% offline, no INTERNET permission.\n' >> dist/notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: NothingBattery v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: dist/notes.md
          files: |
            dist/NothingBattery-v${{ env.VERSION }}.apk
            dist/NothingBattery-v${{ env.VERSION }}.apk.sha256

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
